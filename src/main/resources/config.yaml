server:
  applicationContextPath: /api/v1
  applicationConnectors:
    - type: http
      port: 8080

database:
  driverClass: com.mysql.cj.jdbc.Driver
  user: root
  password: your_password
  url: jdbc:mysql://localhost:3306/interviewprep
  properties:
    charSet: UTF-8
  maxWaitForConnection: 1s
  validationQuery: "SELECT 1"
  minSize: 1
  maxSize: 8